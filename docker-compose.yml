services:
  # ===================================
  # 1. 数据库服务 (MySQL 8.0)
  # ===================================
  mysql:
    image: mysql:8.0
    container_name: exam_mysql
    restart: always
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=500
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-exam_db}
      MYSQL_USER: ${MYSQL_USER:-exam_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-exam_pass123}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - exam_net

  # ===================================
  # 2. 考务系统一体化服务 (FastAPI + 内置前端页面)
  # ===================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exam_app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql+pymysql://${MYSQL_USER:-exam_user}:${MYSQL_PASSWORD:-exam_pass123}@mysql:3306/${MYSQL_DATABASE:-exam_db}?charset=utf8mb4"
      SECRET_KEY: ${SECRET_KEY:-exam_secret_key_antigravity_2026_super_secure_token}
      UPLOAD_DIR: "/app/uploads"
      ONEAUTH_SERVER_URL: ${ONEAUTH_SERVER_URL:-http://192.168.123.233:5174}
      ONEAUTH_CLIENT_ID: ${ONEAUTH_CLIENT_ID:-app_52a0a477a52301c3}
      ONEAUTH_CLIENT_SECRET: ${ONEAUTH_CLIENT_SECRET:-XHmyUn7U90JzTEha_bL_WcMr3NQbkFIgcF75TomhYX65eNwDm3nqP8TLKB-eXeY7}
      ONEAUTH_REDIRECT_URI: ${ONEAUTH_REDIRECT_URI:-http://192.168.123.233:8000/auth/callback}
      TZ: Asia/Shanghai
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "${PORT:-8000}:8000"
    networks:
      - exam_net

volumes:
  mysql_data:
    name: exam_mysql_data
  uploads_data:
    name: exam_uploads_data

networks:
  exam_net:
    name: exam_net
    driver: bridge
